<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>صفحة المندوبين — أسطورة العروس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5f8;--card:#fff;--ink:#1f1424;--muted:#6e5f75;--line:#eadfee;--accent:#8e2a52;--soft:#f6e8ef;--ok:#237a54;--bad:#b82c2c;--wa:#25d366}
@media(prefers-color-scheme:dark){:root{--bg:#140d18;--card:#1f1524;--ink:#f5edf7;--muted:#aa9bb3;--line:#33233b;--accent:#e05c8f;--soft:#2d1d33;--ok:#4fd99b;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:auto;padding:16px}
h1{font-size:1.25rem;margin:0;color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;text-decoration:none;display:inline-block;text-align:center}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.wa,.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.muted{color:var(--muted);font-size:.88rem}
.badge{font-size:.78rem;font-weight:700;color:var(--accent)}
.items{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.it{display:flex;gap:10px;align-items:center}
.it img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none}
.tot{font-weight:700;border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts .pri{flex:1 1 100%}
.focus{outline:2px solid var(--accent)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f1424;color:#fff;padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.err{color:var(--bad);min-height:1.5em;margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>🚚 صفحة المندوبين</h1><button id="logout" hidden style="padding:6px 12px;font-size:.85rem">خروج</button></header>

  <!-- 1) الدخول -->
  <section id="vAuth" class="card" hidden>
    <p class="muted" style="margin-top:0">سجّل دخولك برقم جوالك، ثم وثّق رقمك عبر واتساب. الدخول للمندوبين المضافين من الإدارة فقط.</p>
    <label for="phone">رقم الجوال</label>
    <input id="phone" type="tel" dir="ltr" inputmode="tel" placeholder="05XXXXXXXX" autocomplete="tel">
    <label for="pass">كلمة المرور</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل">
    <p class="err" id="authErr"></p>
    <div class="acts"><button class="pri" id="btnIn">دخول</button><button id="btnUp" style="flex:1 1 100%">حساب جديد (أول مرة)</button></div>
  </section>

  <!-- 2) توثيق الرقم -->
  <section id="vVerify" class="card" hidden>
    <h3 style="margin-top:0">📲 توثيق رقمك</h3>
    <p class="muted">نتأكد من رقمك عبر واتساب، وبعدها تُفعَّل صلاحيتك تلقائياً إن كنت مضافاً كمندوب.</p>
    <p dir="ltr" style="text-align:right;font-weight:700" id="vPhone"></p>
    <p class="err" id="vMsg" style="color:var(--muted)"></p>
    <div class="acts">
      <button class="pri" id="btnVerify">📲 توثيق الرقم عبر واتساب</button>
      <a class="btn wa" id="btnWa" hidden target="_blank" rel="noopener" style="flex:1 1 100%">🟢 افتح واتساب ثم اضغط إرسال</a>
    </div>
  </section>

  <!-- 3) الطلبات -->
  <section id="vOrders" hidden>
    <div class="row"><b id="hello"></b><span class="muted" id="count"></span></div>
    <div class="tabs" id="tabs"></div>
    <div id="focusBox"></div>
    <div id="list"></div>
  </section>
</div>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDhZrTQ4QFM8AhznH5ArQa9A8_kY86G2vM", authDomain: "astorh-d60b8.firebaseapp.com",
  projectId: "astorh-d60b8", storageBucket: "astorh-d60b8.firebasestorage.app",
  messagingSenderId: "881683077545", appId: "1:881683077545:web:d5903a9dc5227194174cb8"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const show = v => ["vAuth", "vVerify", "vOrders"].forEach(x => $(x).hidden = x !== v);
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
}
const money = n => (Math.round((Number(n) || 0) * 100) / 100) + " ر.س";

/* رقم الجوال → 9665XXXXXXXX (نفس منطق المتجر والبوت) */
function normPh(v) {
  let d = String(v || "").replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/\D/g, "");
  if (!d) return ""; if (d.startsWith("00")) d = d.slice(2); else if (d.startsWith("0")) d = "966" + d.slice(1); else if (d.length === 9 && d[0] === "5") d = "966" + d;
  if (d.startsWith("9660")) d = "966" + d.slice(4);
  return /^9665\d{8}$/.test(d) ? d : "";
}
const emailOf = ph => `p${ph}@courier.astorh.local`;
const phoneOf = u => (/^p(\d+)@courier\.astorh\.local$/.exec(u?.email || "") || [])[1] || "";

/* ---------- الدخول ---------- */
const AUTH_ERR = {
  "auth/invalid-credential": "الرقم أو كلمة المرور غير صحيحة. إن كانت أول مرة اضغط «حساب جديد».",
  "auth/user-not-found": "لا يوجد حساب بهذا الرقم. اضغط «حساب جديد».", "auth/wrong-password": "كلمة المرور غير صحيحة.",
  "auth/email-already-in-use": "الحساب موجود مسبقاً، اضغط «دخول».", "auth/weak-password": "كلمة المرور قصيرة (6 أحرف على الأقل).",
  "auth/too-many-requests": "محاولات كثيرة، انتظر قليلاً.", "auth/network-request-failed": "تأكد من الاتصال بالإنترنت."
};
async function doAuth(create) {
  const ph = normPh($("phone").value), pw = $("pass").value;
  $("authErr").textContent = "";
  if (!ph) { $("authErr").textContent = "اكتب رقم جوال سعودي صحيح (05XXXXXXXX)"; return; }
  if (pw.length < 6) { $("authErr").textContent = "كلمة المرور 6 أحرف على الأقل"; return; }
  try { create ? await createUserWithEmailAndPassword(auth, emailOf(ph), pw) : await signInWithEmailAndPassword(auth, emailOf(ph), pw); }
  catch (e) { $("authErr").textContent = AUTH_ERR[e.code] || ("تعذر الدخول: " + (e.code || e.message)); }
}
$("btnIn").onclick = () => doAuth(false);
$("btnUp").onclick = () => doAuth(true);
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(false); });
$("logout").onclick = () => signOut(auth);

/* ---------- الحالة ---------- */
let unsubs = [];
const clearSubs = () => { unsubs.forEach(u => u()); unsubs = []; };
let me = null;               // { uid, phone, name }

onAuthStateChanged(auth, user => {
  clearSubs(); $("logout").hidden = !user;
  if (!user) { me = null; show("vAuth"); return; }
  const phone = phoneOf(user);
  if (!phone) { toast("هذا الحساب ليس حساب مندوب"); signOut(auth); return; }
  me = { uid: user.uid, phone, name: phone };
  let graceTimer = null, verified = false;
  show("vVerify"); $("vPhone").textContent = "+" + phone; setupVerify();
  // صلاحية المندوب يمنحها البوت (staff/{uid}) بعد توثيق الرقم
  unsubs.push(onSnapshot(doc(db, "staff", user.uid), s => {
    const d = s.data();
    if (d && d.role === "courier") { clearTimeout(graceTimer); me.name = d.name || phone; startOrders(); }
    else if (verified) { show("vVerify"); $("btnVerify").hidden = true; $("btnWa").hidden = true; $("vMsg").textContent = "⚠️ رقمك موثّق، لكنه غير مضاف كمندوب. تواصل مع الإدارة لإضافتك."; }
  }, () => {}));
  unsubs.push(onSnapshot(doc(db, "customers", user.uid), s => {
    const d = s.data();
    if (d?.phoneVerified && d.verifiedPhone === phone && !verified) {
      verified = true; $("vMsg").textContent = "✅ تم توثيق رقمك، جارٍ تفعيل صلاحيتك…";
      graceTimer = setTimeout(() => { $("btnVerify").hidden = true; $("btnWa").hidden = true; $("vMsg").textContent = "⚠️ رقمك موثّق، لكنه غير مضاف كمندوب. تواصل مع الإدارة لإضافتك."; }, 8000);
    }
  }, () => {}));
});

/* ---------- توثيق الرقم عبر البوت ---------- */
const VERR = { invalid_phone: "رقم الجوال غير صحيح", bot_offline: "خدمة التوثيق غير متاحة حالياً، حاول بعد قليل", rate_limited: "انتظر ثواني ثم حاول مرة أخرى", expired: "انتهت صلاحية الكود، اطلب كوداً جديداً" };
function setupVerify() {
  let waiting = false, vUnsub = null;
  const ref = doc(db, "verifyRequests", me.uid);
  $("btnVerify").hidden = false; $("btnWa").hidden = true; $("btnVerify").disabled = false; $("btnVerify").textContent = "📲 توثيق الرقم عبر واتساب"; $("vMsg").textContent = "";
  vUnsub?.(); vUnsub = onSnapshot(ref, s => {
    const d = s.data(); if (!d || !waiting) return;
    if (d.status === "pending" && d.waLink) {
      $("btnWa").href = d.waLink; $("btnWa").hidden = false; $("btnVerify").disabled = false; $("btnVerify").textContent = "🔄 كود جديد";
      $("vMsg").textContent = d.lastError === "mismatch" ? "⚠️ أرسلت من رقم غير رقمك المسجّل. أرسل من نفس الرقم." : "اضغط الزر الأخضر ثم أرسل الرسالة الجاهزة كما هي.";
    } else if (VERR[d.status]) { $("vMsg").textContent = "⚠️ " + VERR[d.status]; $("btnVerify").disabled = false; }
  }, () => {});
  unsubs.push(() => vUnsub?.());
  $("btnVerify").onclick = async () => {
    $("btnVerify").disabled = true; $("btnWa").hidden = true; waiting = true; $("vMsg").textContent = "جارٍ تجهيز الكود...";
    try {
      await setDoc(ref, { phone: me.phone, status: "requested", requestedAt: serverTimestamp() }, { merge: true });
      setTimeout(() => { if (waiting && $("btnWa").hidden && !$("vVerify").hidden) { $("vMsg").textContent = "⚠️ الخدمة لا تستجيب الآن، حاول بعد قليل"; $("btnVerify").disabled = false; } }, 15000);
    } catch (e) { $("vMsg").textContent = "تعذر الطلب: " + (e.code || e.message); $("btnVerify").disabled = false; }
  };
}

/* ---------- الطلبات ---------- */
const ST = [["buying", "🛒 جاري الشراء"], ["bought", "✅ تم الشراء"], ["delivering", "🚚 في الطريق"], ["done", "🏁 تم التسليم"]];
const ST_ALL = { new: "🆕 جديد", preparing: "⏳ تجهيز", cancelled: "ملغي", ...Object.fromEntries(ST) };
let tab = "new", all = [], first = true, focusId = (location.hash.match(/^#d=(.+)$/) || [])[1] || "";
window.addEventListener("hashchange", () => { focusId = (location.hash.match(/^#d=(.+)$/) || [])[1] || ""; draw(); });

function startOrders() {
  if (!$("vOrders").hidden) return;
  show("vOrders"); $("hello").textContent = "أهلاً " + me.name;
  first = true;
  unsubs.push(onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc"), limit(60)), s => {
    if (!first && s.docChanges().some(c => c.type === "added" && !c.doc.data().courierUid)) { toast("🔔 طلب جديد!"); navigator.vibrate?.(300); }
    first = false; all = s.docs; draw();
  }, e => toast("تعذر تحميل الطلبات: " + (e.code || e.message))));
}

const isMine = o => o.courierUid === me.uid;
const isFree = o => !o.courierUid && !o.courier;
function sets() {
  const act = all.filter(d => !["done", "cancelled"].includes(d.data().status));
  return {
    new: act.filter(d => isFree(d.data())),
    mine: act.filter(d => isMine(d.data())),
    done: all.filter(d => isMine(d.data()) && d.data().status === "done")
  };
}
function draw() {
  if ($("vOrders").hidden || !me) return;
  const s = sets();
  $("count").textContent = `${s.new.length} جديدة`;
  $("tabs").replaceChildren(...[["new", "🆕 جديدة"], ["mine", "🚚 طلباتي"], ["done", "🏁 منتهية"]].map(([k, t]) =>
    el("button", { class: tab === k ? "on" : "", text: `${t} (${s[k].length})`, onclick: () => { tab = k; draw(); } })));
  const f = focusId && all.find(d => d.id === focusId);
  $("focusBox").replaceChildren(...(f ? [el("p", { class: "badge", text: "🔎 الطلب المطلوب" }), card(f, true)] : []));
  const rest = s[tab].filter(d => !f || d.id !== f.id);
  $("list").replaceChildren(...(rest.length ? rest.map(d => card(d)) : [el("p", { class: "muted", style: "text-align:center;padding:30px 0", text: "لا توجد طلبات هنا" })]));
}

function card(d, isFocus) {
  const o = d.data(), mine = isMine(o), idx = ST.findIndex(x => x[0] === o.status), nx = ST[idx + 1];
  const ph = String(o.phone || "").replace(/\D/g, "");
  const waNum = ph.startsWith("0") ? "966" + ph.slice(1) : ph;
  const items = el("div", { class: "items" }, ...(o.items || []).map(i =>
    el("div", { class: "it" }, i.image ? el("img", { src: i.image, alt: "", loading: "lazy", onerror: e => e.target.remove() }) : null,
      el("div", {}, el("b", { text: `${i.qty}x ${i.name}` }), el("div", { class: "muted", text: [i.size, i.flavor, i.note].filter(Boolean).join(" • ") })))));
  const acts = el("div", { class: "acts" });
  if (isFree(o)) acts.append(el("button", { class: "pri", text: "✋ أخذ الطلب", onclick: () => take(d) }));
  else if (mine) {
    if (ph) acts.append(el("a", { class: "btn", href: `tel:${ph}`, text: "📞 اتصال" }), el("a", { class: "btn", href: `https://wa.me/${waNum}`, target: "_blank", rel: "noopener", text: "💬 واتساب" }));
    if (o.locationUrl && /^https?:\/\//.test(o.locationUrl)) acts.append(el("a", { class: "btn", href: o.locationUrl, target: "_blank", rel: "noopener", text: "🧭 توجيه" }));
    acts.append(el("button", { text: "📋 نسخ العنوان", onclick: () => navigator.clipboard?.writeText(o.address || "").then(() => toast("تم النسخ")) }));
    const next = nx || (["new", "preparing"].includes(o.status) ? ST[0] : null);
    if (next) acts.append(el("button", { class: "pri", text: "التالي ← " + next[1], onclick: () => setStatus(d, next[0]) }));
    if (o.status === "buying") acts.append(el("button", { text: "↩️ إرجاع الطلب للقائمة", onclick: () => release(d) }));
  } else acts.append(el("span", { class: "muted", text: `✅ مع المندوب ${o.courier || ""}` }));
  return el("div", { class: "card" + (isFocus ? " focus" : ""), style: (o.courierUid && !mine) ? "opacity:.55" : "" },
    el("div", { class: "row" }, el("b", { text: o.customerName || "" }), el("span", { class: "badge", text: ST_ALL[o.status] || o.status })),
    el("div", { class: "muted", text: "📍 " + (o.address || "") }),
    o.notes ? el("div", { class: "muted", text: "📝 " + o.notes }) : null,
    o.gift ? el("div", { class: "muted", text: "🎁 هدية إلى " + o.gift.name }) : null,
    o.integrity?.ok === false ? el("div", { class: "muted", style: "color:var(--bad)", text: "⚠️ " + (o.integrity.issues || []).join(" • ") }) : null,
    items, el("div", { class: "row tot" }, el("span", { text: "💰 المطلوب تحصيله" }), el("span", { text: money(o.total) })), acts);
}

async function take(d) {
  try { await updateDoc(d.ref, { courier: me.name, courierPhone: me.phone, courierUid: me.uid, status: "buying" }); toast("تم أخذ الطلب ✓"); tab = "mine"; }
  catch (e) { toast(e.code === "permission-denied" ? "سبقك مندوب آخر على هذا الطلب" : "تعذر أخذ الطلب"); }
}
async function setStatus(d, st) {
  try { await updateDoc(d.ref, { status: st }); toast("تم التحديث ✓"); }
  catch { toast("تعذر التحديث"); }
}
async function release(d) {
  if (!confirm("إرجاع الطلب للقائمة ليأخذه مندوب آخر؟")) return;
  try { await updateDoc(d.ref, { courier: "", courierPhone: "", courierUid: "", status: "new" }); toast("تم إرجاع الطلب"); tab = "new"; }
  catch { toast("تعذر الإرجاع"); }
}
</script>
</body>
</html>
